<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Central de links com três opções de acesso externo."
    />
    <title>Central de links</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Camada 1: Cenário Ultracolorido de Fantasia em Profundidade + Nuvens, Lanternas, Discos Dourados e Reflexos -->
    <div class="cena-ultracolorida" aria-hidden="true">
      <div class="cenario-jardim"></div>
      <div class="halo-neon-multicolor"></div>

      <!-- Nuvens em Planos Distintos (Ciclos de 18s a 25s) -->
      <div class="camada-nuvens plano-nuvens-distante">
        <svg class="nuvem-fantasia nuvem-d1" viewBox="0 0 280 96">
          <defs>
            <linearGradient id="grad-nuvem-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF9CEE" stop-opacity="0.55" />
              <stop offset="55%" stop-color="#F62FB4" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#2454FF" stop-opacity="0.18" />
            </linearGradient>
            <linearGradient id="grad-nuvem-ciano" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF1B5" stop-opacity="0.5" />
              <stop offset="50%" stop-color="#37E5F3" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#007E78" stop-opacity="0.16" />
            </linearGradient>
          </defs>
          <path
            d="M26 74H242C262 74 272 58 262 43C254 30 236 29 226 38C216 16 188 8 166 19C150 6 120 8 106 28C86 19 60 27 54 46C34 44 16 55 26 74Z"
            fill="url(#grad-nuvem-magenta)"
            stroke="rgba(255, 241, 181, 0.42)"
            stroke-width="2"
          />
        </svg>

        <svg class="nuvem-fantasia nuvem-d2" viewBox="0 0 280 96">
          <path
            d="M26 74H242C262 74 272 58 262 43C254 30 236 29 226 38C216 16 188 8 166 19C150 6 120 8 106 28C86 19 60 27 54 46C34 44 16 55 26 74Z"
            fill="url(#grad-nuvem-ciano)"
            stroke="rgba(55, 229, 243, 0.38)"
            stroke-width="2"
          />
        </svg>
      </div>

      <div class="camada-nuvens plano-nuvens-proximo">
        <svg class="nuvem-fantasia nuvem-p1" viewBox="0 0 260 90">
          <path
            d="M22 68H224C242 68 252 54 242 40C234 28 216 28 208 36C198 16 174 8 154 18C138 6 112 8 100 26C82 18 58 26 52 44C34 42 16 51 22 68Z"
            fill="url(#grad-nuvem-magenta)"
            stroke="rgba(255, 241, 181, 0.55)"
            stroke-width="2.2"
          />
        </svg>

        <svg class="nuvem-fantasia nuvem-p2" viewBox="0 0 260 90">
          <path
            d="M22 68H224C242 68 252 54 242 40C234 28 216 28 208 36C198 16 174 8 154 18C138 6 112 8 100 26C82 18 58 26 52 44C34 42 16 51 22 68Z"
            fill="url(#grad-nuvem-ciano)"
            stroke="rgba(255, 241, 181, 0.5)"
            stroke-width="2.2"
          />
        </svg>
      </div>

      <!-- Lanternas de Festival em Camada Separada (Balanço de 4–6s, ~3 graus) -->
      <div class="lanterna-festival lanterna-esq">
        <svg viewBox="0 0 96 190">
          <defs>
            <radialGradient id="luz-lanterna-v2" cx="50%" cy="46%" r="54%">
              <stop offset="0%" stop-color="#FFF9EF" />
              <stop offset="28%" stop-color="#FFF1B5" />
              <stop offset="62%" stop-color="#FF655C" />
              <stop offset="100%" stop-color="#B81448" />
            </radialGradient>
            <linearGradient id="ouro-lanterna-v2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8E4B0B" />
              <stop offset="30%" stop-color="#FFF1B5" />
              <stop offset="55%" stop-color="#EFAF24" />
              <stop offset="85%" stop-color="#FFFFFF" />
              <stop offset="100%" stop-color="#8E4B0B" />
            </linearGradient>
          </defs>
          <line x1="48" y1="0" x2="48" y2="32" stroke="url(#ouro-lanterna-v2)" stroke-width="4" />
          <rect x="26" y="28" width="44" height="10" rx="4" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="1.8" />
          <ellipse cx="48" cy="76" rx="36" ry="42" fill="url(#luz-lanterna-v2)" stroke="url(#ouro-lanterna-v2)" stroke-width="3.2" />
          <path d="M32 37C20 62 20 90 32 115M64 37C76 62 76 90 64 115M48 35V117" stroke="url(#ouro-lanterna-v2)" stroke-width="2" fill="none" />
          <rect x="28" y="114" width="40" height="9" rx="4" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="1.8" />
          <circle cx="48" cy="131" r="6" fill="#007E78" stroke="#FFF1B5" stroke-width="1.8" />
          <path d="M41 137V174M48 137V182M55 137V174" stroke="#FF655C" stroke-width="3.2" stroke-linecap="round" />
        </svg>
      </div>

      <div class="lanterna-festival lanterna-dir">
        <svg viewBox="0 0 96 190">
          <line x1="48" y1="0" x2="48" y2="32" stroke="url(#ouro-lanterna-v2)" stroke-width="4" />
          <rect x="26" y="28" width="44" height="10" rx="4" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="1.8" />
          <ellipse cx="48" cy="76" rx="36" ry="42" fill="url(#luz-lanterna-v2)" stroke="url(#ouro-lanterna-v2)" stroke-width="3.2" />
          <path d="M32 37C20 62 20 90 32 115M64 37C76 62 76 90 64 115M48 35V117" stroke="url(#ouro-lanterna-v2)" stroke-width="2" fill="none" />
          <rect x="28" y="114" width="40" height="9" rx="4" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="1.8" />
          <circle cx="48" cy="131" r="6" fill="#007E78" stroke="#FFF1B5" stroke-width="1.8" />
          <path d="M41 137V174M48 137V182M55 137V174" stroke="#FF655C" stroke-width="3.2" stroke-linecap="round" />
        </svg>
      </div>

      <!-- Discos Dourados Flutuantes com Ciclos Desencontrados (8–12s) -->
      <div class="disco-dourado disco-1">
        <svg viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="21" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="2" />
          <circle cx="26" cy="26" r="15" fill="none" stroke="#FFF9EF" stroke-width="1.4" stroke-dasharray="4 3" />
          <rect x="19" y="19" width="14" height="14" rx="2.5" fill="#160B3D" stroke="#FFF1B5" stroke-width="2" />
        </svg>
      </div>

      <div class="disco-dourado disco-2">
        <svg viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="21" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="2" />
          <circle cx="26" cy="26" r="15" fill="none" stroke="#FFF9EF" stroke-width="1.4" stroke-dasharray="4 3" />
          <rect x="19" y="19" width="14" height="14" rx="2.5" fill="#160B3D" stroke="#FFF1B5" stroke-width="2" />
        </svg>
      </div>

      <div class="disco-dourado disco-3">
        <svg viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="20" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="2" />
          <rect x="19" y="19" width="14" height="14" rx="2.5" fill="#160B3D" stroke="#FFF1B5" stroke-width="2" />
        </svg>
      </div>

      <div class="disco-dourado disco-4">
        <svg viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="20" fill="url(#ouro-lanterna-v2)" stroke="#5A2A00" stroke-width="2" />
          <rect x="19" y="19" width="14" height="14" rx="2.5" fill="#160B3D" stroke="#FFF1B5" stroke-width="2" />
        </svg>
      </div>

      <!-- Reflexos Cintilantes na Água na Base -->
      <div class="reflexos-lago">
        <span class="reflexo-agua r-agua-1"></span>
        <span class="reflexo-agua r-agua-2"></span>
        <span class="reflexo-agua r-agua-3"></span>
      </div>
    </div>

    <main class="central">
      <header class="heroi-ultracolorido">
        <!-- Palco em Camadas Independentes: Dragão Jade/Ouro (atrás) + Tigre Dourado (com Quadros Adicionais de Aceno e Piscar) -->
        <div class="palco-personagem" aria-hidden="true">
          <!-- Camada Independente 1: Dragão Ornamental em Jade/Turquesa e Ouro (Ciclo Sinuoso 12s) -->
          <div class="camada-dragao">
            <img
              src="./assets/dragao-jade-ouro.webp"
              alt=""
              width="750"
              height="246"
              class="img-dragao-jade"
            />
          </div>

          <!-- Fita de Luz Neon Magenta/Ciano atrás do Tigre -->
          <div class="aura-neon-tigre"></div>

          <!-- Camada Independente 2: Tigre Dourado Sem Fundo + Quadros Adicionais para Piscar e Acenar + Respiração 4s -->
          <div class="camada-tigre-respiracao">
            <div class="quadros-tigre">
              <img
                src="./assets/tigre-q1-base.webp"
                alt=""
                width="740"
                height="476"
                class="tigre-quadro tigre-q1"
              />
              <img
                src="./assets/tigre-q2-aceno.webp"
                alt=""
                width="740"
                height="476"
                class="tigre-quadro tigre-q2"
              />
              <img
                src="./assets/tigre-q3-piscar.webp"
                alt=""
                width="740"
                height="476"
                class="tigre-quadro tigre-q3"
              />
            </div>
          </div>
        </div>

        <!-- Plaqueta Imperial de Jade, Rubi/Ameixa e Ouro Espelhado ("Central de links") -->
        <div class="plaqueta-imperial-wrapper">
          <div class="plaqueta-imperial">
            <span class="ornamento-jade ornamento-jade-esq" aria-hidden="true"></span>
            <span class="joia-topo-plaqueta" aria-hidden="true"></span>
            <p class="plaqueta-titulo">Central de links</p>
            <span class="joia-base-plaqueta" aria-hidden="true"></span>
            <span class="ornamento-jade ornamento-jade-dir" aria-hidden="true"></span>
            <span class="borla-plaqueta borla-esq" aria-hidden="true"></span>
            <span class="borla-plaqueta borla-dir" aria-hidden="true"></span>
          </div>
        </div>

        <h1>Escolha seu acesso</h1>
        <p class="subtitulo">
          Selecione uma das opções abaixo para abrir o site correspondente.
        </p>
      </header>

      <section class="grade" aria-label="Opções de acesso">
        <!-- CARTÃO 1: PERGAMINHO IMPERIAL DOURADO -->
        <article class="cartao">
          <span class="canto-ouro canto-se" aria-hidden="true"></span>
          <span class="canto-ouro canto-sd" aria-hidden="true"></span>
          <span class="canto-ouro canto-ie" aria-hidden="true"></span>
          <span class="canto-ouro canto-id" aria-hidden="true"></span>

          <div class="cartao-ilustracao" aria-hidden="true">
            <img
              src="./assets/ilustracao-pergaminho.webp"
              alt=""
              width="316"
              height="172"
              class="img-ilustracao-cartao"
            />
          </div>

          <div class="cartao-corpo">
            <h2>Acesso 1</h2>
            <p class="dominio">sm8dzy.com</p>
            <a
              class="botao"
              href="https://sm8dzy.com/?pid=6942440235&amp;fromPage=AGENCY_ONE"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="botao-texto">Abrir acesso 1</span>
              <svg class="icone-externo" viewBox="0 0 22 22" aria-hidden="true">
                <path
                  d="M12 4H18V10M18 4L10 12M9 6H5.5C4.67 6 4 6.67 4 7.5V16.5C4 17.33 4.67 18 5.5 18H14.5C15.33 18 16 17.33 16 16.5V13"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </article>

        <!-- CARTÃO 2: BAÚ IMPERIAL DE JADE E OURO -->
        <article class="cartao">
          <span class="canto-ouro canto-se" aria-hidden="true"></span>
          <span class="canto-ouro canto-sd" aria-hidden="true"></span>
          <span class="canto-ouro canto-ie" aria-hidden="true"></span>
          <span class="canto-ouro canto-id" aria-hidden="true"></span>

          <div class="cartao-ilustracao" aria-hidden="true">
            <img
              src="./assets/ilustracao-bau.webp"
              alt=""
              width="316"
              height="172"
              class="img-ilustracao-cartao"
            />
          </div>

          <div class="cartao-corpo">
            <h2>Acesso 2</h2>
            <p class="dominio">npcyog.com</p>
            <a
              class="botao"
              href="https://npcyog.com/?pid=2848417439&amp;fromPage=AGENCY_ONE"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="botao-texto">Abrir acesso 2</span>
              <svg class="icone-externo" viewBox="0 0 22 22" aria-hidden="true">
                <path
                  d="M12 4H18V10M18 4L10 12M9 6H5.5C4.67 6 4 6.67 4 7.5V16.5C4 17.33 4.67 18 5.5 18H14.5C15.33 18 16 17.33 16 16.5V13"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </article>

        <!-- CARTÃO 3: TALISMÃ / CABAÇA IMPERIAL DE OURO -->
        <article class="cartao">
          <span class="canto-ouro canto-se" aria-hidden="true"></span>
          <span class="canto-ouro canto-sd" aria-hidden="true"></span>
          <span class="canto-ouro canto-ie" aria-hidden="true"></span>
          <span class="canto-ouro canto-id" aria-hidden="true"></span>

          <div class="cartao-ilustracao" aria-hidden="true">
            <img
              src="./assets/ilustracao-talisma.webp"
              alt=""
              width="316"
              height="172"
              class="img-ilustracao-cartao"
            />
          </div>

          <div class="cartao-corpo">
            <h2>Acesso 3</h2>
            <p class="dominio">gcx27r.com</p>
            <a
              class="botao"
              href="https://gcx27r.com/?pid=2744555209&amp;fromPage=AGENCY_ONE"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="botao-texto">Abrir acesso 3</span>
              <svg class="icone-externo" viewBox="0 0 22 22" aria-hidden="true">
                <path
                  d="M12 4H18V10M18 4L10 12M9 6H5.5C4.67 6 4 6.67 4 7.5V16.5C4 17.33 4.67 18 5.5 18H14.5C15.33 18 16 17.33 16 16.5V13"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </article>
      </section>

      <footer class="rodape-imperial">
        <div class="linha-aviso">
          <span class="traco-ouro traco-esq" aria-hidden="true"></span>
          <p class="aviso">Os links abrem sites externos.</p>
          <span class="traco-ouro traco-dir" aria-hidden="true"></span>
        </div>

        <!-- Controle Acessível sem JavaScript para Pausar Movimentos Automáticos -->
        <div class="controle-movimento">
          <input
            type="checkbox"
            id="pausar-animacoes"
            class="controle-pausa-input"
          />
          <label for="pausar-animacoes" class="controle-pausa-rotulo">
            <span class="indicador-pausa" aria-hidden="true"></span>
            <span class="texto-pausar">Pausar animações</span>
            <span class="texto-retomar">Animações pausadas (ativar)</span>
          </label>
        </div>
      </footer>
    </main>
  </body>
</html>
