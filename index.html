<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Escolha entre três acessos para abrir o site correspondente.">
    <title>Central de links</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="central">
      <header class="intro">
        <h1>Escolha seu acesso</h1>
        <p>Selecione uma das opções abaixo para abrir o site correspondente.</p>
      </header>

      <div class="acessos">
        <article class="cartao" aria-labelledby="acesso-1">
          <span class="numero" aria-hidden="true">01</span>
          <h2 id="acesso-1">Acesso 1</h2>
          <p class="dominio">sm8dzy.com</p>
          <a class="botao" href="https://sm8dzy.com/?pid=6942440235&amp;fromPage=AGENCY_ONE" target="_blank" rel="noopener noreferrer" aria-describedby="aviso-externo">Abrir acesso 1 <span aria-hidden="true">↗</span></a>
        </article>

        <article class="cartao" aria-labelledby="acesso-2">
          <span class="numero" aria-hidden="true">02</span>
          <h2 id="acesso-2">Acesso 2</h2>
          <p class="dominio">npcyog.com</p>
          <a class="botao" href="https://npcyog.com/?pid=2848417439&amp;fromPage=AGENCY_ONE" target="_blank" rel="noopener noreferrer" aria-describedby="aviso-externo">Abrir acesso 2 <span aria-hidden="true">↗</span></a>
        </article>

        <article class="cartao" aria-labelledby="acesso-3">
          <span class="numero" aria-hidden="true">03</span>
          <h2 id="acesso-3">Acesso 3</h2>
          <p class="dominio">gcx27r.com</p>
          <a class="botao" href="https://gcx27r.com/?pid=2744555209&amp;fromPage=AGENCY_ONE" target="_blank" rel="noopener noreferrer" aria-describedby="aviso-externo">Abrir acesso 3 <span aria-hidden="true">↗</span></a>
        </article>
      </div>

      <footer class="aviso">
        <p id="aviso-externo">Os links abrem sites externos.</p>
      </footer>
    </main>
  </body>
</html>
